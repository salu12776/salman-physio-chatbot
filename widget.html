<!--
  Salman Physio Care - Chat Widget
  ---------------------------------
  Is poore <div> aur <script> ko apni website ke HTML mein,
  </body> tag se thora pehle paste kar dein.

  Sirf ek cheez zaroor badlein: neeche "API_URL" ki value,
  apne Render deploy hue backend ke URL se.
-->

<div id="spc-chat-widget">
  <button id="spc-chat-toggle" aria-label="Chat kholein">💬</button>

  <div id="spc-chat-window">
    <div id="spc-chat-header">
      <span>Salman Physio Care</span>
      <button id="spc-chat-close" aria-label="Chat band karein">✕</button>
    </div>
    <div id="spc-chat-messages"></div>
    <form id="spc-chat-form">
      <input id="spc-chat-input" type="text" placeholder="Apna sawal likhein..." autocomplete="off" />
      <button type="submit">Bhejein</button>
    </form>
  </div>
</div>

<style>
  #spc-chat-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #spc-chat-toggle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #0d9488;
    color: white;
    border: none;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }

  #spc-chat-window {
    display: none;
    flex-direction: column;
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 340px;
    max-width: 90vw;
    height: 460px;
    max-height: 70vh;
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }

  #spc-chat-window.open {
    display: flex;
  }

  #spc-chat-header {
    background: #0d9488;
    color: white;
    padding: 14px 16px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #spc-chat-header button {
    background: none;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  #spc-chat-messages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    background: #f9fafb;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .spc-msg {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }

  .spc-msg.user {
    align-self: flex-end;
    background: #0d9488;
    color: white;
  }

  .spc-msg.bot {
    align-self: flex-start;
    background: #e5e7eb;
    color: #111827;
  }

  #spc-chat-form {
    display: flex;
    border-top: 1px solid #e5e7eb;
  }

  #spc-chat-input {
    flex: 1;
    border: none;
    padding: 12px;
    font-size: 14px;
    outline: none;
  }

  #spc-chat-form button {
    background: #0d9488;
    color: white;
    border: none;
    padding: 0 16px;
    cursor: pointer;
    font-size: 14px;
  }
</style>

<script>
  (function () {
    // ⚠️ YAHAN APNA RENDER BACKEND URL DAALEIN
    const API_URL = "https://your-app-name.onrender.com";

    const toggleBtn = document.getElementById("spc-chat-toggle");
    const closeBtn = document.getElementById("spc-chat-close");
    const chatWindow = document.getElementById("spc-chat-window");
    const messagesEl = document.getElementById("spc-chat-messages");
    const form = document.getElementById("spc-chat-form");
    const input = document.getElementById("spc-chat-input");

    let sessionId = localStorage.getItem("spc_session_id") || null;

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "spc-msg " + sender;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    toggleBtn.addEventListener("click", () => {
      chatWindow.classList.toggle("open");
      if (chatWindow.classList.contains("open") && messagesEl.children.length === 0) {
        addMessage("Assalam o Alaikum! Salman Physio Care mein khush aamdeed. Aap kya poochna chahenge?", "bot");
      }
    });

    closeBtn.addEventListener("click", () => {
      chatWindow.classList.remove("open");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";

      const typingEl = document.createElement("div");
      typingEl.className = "spc-msg bot";
      typingEl.textContent = "...";
      messagesEl.appendChild(typingEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch(API_URL + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, session_id: sessionId }),
        });

        if (!res.ok) throw new Error("Server error");

        const data = await res.json();
        sessionId = data.session_id;
        localStorage.setItem("spc_session_id", sessionId);

        typingEl.textContent = data.answer;
      } catch (err) {
        typingEl.textContent = "Maazrat, abhi jawab nahi mil saka. Baad mein dobara koshish karein.";
      }
    });
  })();
</script>
