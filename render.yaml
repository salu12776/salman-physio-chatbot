# Render ye file khud detect kar leta hai agar repo ki root mein ho.
# Ye "Blueprint" deploy ke liye hai — agar aap manually Render dashboard se
# Web Service banayenge to isay ignore karke wahan yehi settings daal dena.

services:
  - type: web
    name: salman-physio-chatbot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: COHERE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: salman_physio_docs
      - key: ALLOWED_ORIGINS
        value: "https://salu12776.github.io"
